name: Sync Steam & deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 14 * * *' # 14:00 UTC = midnight/1am Sydney, once a day
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pull Steam library
        if: env.STEAM_API_KEY != ''
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_ID: ${{ vars.STEAM_ID || '76561199030107081' }}
        run: node scripts/sync-steam.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- data; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/steam-library.json data/steam-sync-meta.json
          git commit -m "chore: sync Steam library"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: sync
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
